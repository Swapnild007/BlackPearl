<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f5f3ff"><title>AI/ML Command School</title><style>
:root{--bg:#f5f3ff;--bg2:#edf2ff;--card:#ffffffdc;--ink:#151522;--muted:#696978;--line:#e6e4ef;--a:#635bff;--a2:#8b5cf6;--ok:#16835a;--shadow:0 18px 55px #29255212;--r:24px}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 10% 0,#fff,transparent 30%),linear-gradient(145deg,var(--bg),var(--bg2));color:var(--ink);font:16px/1.65 -apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text",Inter,system-ui,sans-serif}button,input,textarea{font:inherit}button{cursor:pointer}.top{position:sticky;top:0;z-index:9;background:#f7f6fcdc;backdrop-filter:blur(22px);border-bottom:1px solid var(--line)}.topin,.layout{max-width:1220px;margin:auto}.topin{padding:13px 18px;display:flex}.brand{font-weight:850}.brand i{color:var(--a);font-style:normal}.status{margin-left:auto;color:var(--muted);font-size:12px}.layout{padding:24px 18px 70px;display:grid;grid-template-columns:275px 1fr;gap:22px}.side{position:sticky;top:70px;height:calc(100vh - 90px);overflow:auto}.card{background:var(--card);border:1px solid #fff;border-radius:var(--r);box-shadow:var(--shadow)}.side .card{padding:12px}.search{width:100%;padding:10px;border:1px solid var(--line);border-radius:13px;background:#fff}.nav{width:100%;border:0;background:transparent;text-align:left;padding:10px;border-radius:13px;color:#444451}.nav:hover,.nav.on{background:#fff;color:var(--a)}.nav small{display:block;color:var(--muted);font-size:10px}.ey{font-size:11px;text-transform:uppercase;letter-spacing:.14em;color:var(--a);font-weight:850}h1{font-size:clamp(42px,6vw,72px);line-height:1;letter-spacing:-.06em;margin:10px 0 18px}h2{font-size:30px;line-height:1.1;letter-spacing:-.04em}.lead{font-size:18px;color:#575765;max-width:850px}.hero{padding:38px 30px;background:linear-gradient(135deg,#fff,#f8f6ff);overflow:hidden}.section{padding:25px;margin-top:18px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:16px}.stat{padding:17px}.stat b{font-size:28px;display:block}.stat span{font-size:12px;color:var(--muted)}.module,.project{padding:19px;cursor:pointer}.module h3,.project h3{margin:5px 0;font-size:19px}.module p,.project p{font-size:13px;color:var(--muted)}.tag{display:inline-block;background:#f0edff;color:#584de4;padding:3px 8px;border-radius:99px;font-size:10px;font-weight:800}.bar{height:6px;background:#eceaf2;border-radius:99px;margin-top:12px}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--a),var(--a2));border-radius:99px}.lesson{display:flex;gap:12px;align-items:center;background:#fff;border:1px solid var(--line);padding:13px;border-radius:15px;margin:8px 0;cursor:pointer}.lesson small{display:block;color:var(--muted)}.check{margin-left:auto;width:21px;height:21px;border:1px solid var(--line);border-radius:50%;display:grid;place-items:center}.done{background:var(--ok);color:#fff;border-color:var(--ok)}.btn{border:1px solid var(--line);background:#fff;border-radius:13px;padding:10px 14px;font-weight:750}.primary{background:var(--a);color:#fff;border-color:var(--a)}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:17px}.call{background:#f4f1ff;border-left:4px solid var(--a);padding:14px 16px;border-radius:13px;margin:15px 0}.code{background:#15151d;color:#eee;padding:17px;border-radius:15px;overflow:auto;font:13px/1.7 ui-monospace,monospace}.table{width:100%;border-collapse:collapse;font-size:13px}.table td,.table th{padding:10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}.note{width:100%;min-height:130px;border:1px solid var(--line);border-radius:15px;padding:13px;background:#fff}.choice{display:block;width:100%;text-align:left;border:1px solid var(--line);background:#fafafd;border-radius:12px;padding:10px;margin:7px 0}.correct{background:#effbf5;border-color:#69b995}.wrong{background:#fff2f2;border-color:#db8b8b}.crumb{font-size:12px;color:var(--muted)}@media(max-width:800px){.layout{display:block;padding:12px}.side{position:static;height:auto;margin-bottom:12px}.side .card{display:flex;overflow:auto;gap:4px}.search,.side .ey{display:none}.nav{min-width:max-content}.nav small{display:none}.grid{grid-template-columns:1fr}.stats{grid-template-columns:1fr 1fr 1fr}.hero{padding:28px 20px}.section{padding:20px}h1{font-size:44px}}
</style></head><body><header class="top"><div class="topin"><div class="brand">AI/ML <i>Command School</i></div><div class="status" id="status">Offline · local progress</div></div></header><div class="layout"><aside class="side"><div class="card"><input class="search" placeholder="Search…" oninput="search(this.value)"><div id="nav"></div><button class="nav" onclick="page('projects')">Project Studio</button><button class="nav" onclick="page('academic')">Academic Structure</button><button class="nav" onclick="page('glossary')">Glossary</button></div></aside><main id="main"></main></div>
<script>
const M=[
["1","Mathematical & Computational Foundations","Math + systems",["Vector spaces, inner products, projections","Eigenvalues/eigenvectors, SVD","LU, QR, Cholesky, low-rank approximation","Discrete/continuous and multivariate distributions","Expectation, variance, Bayes, MLE, MAP","Hypothesis testing and concentration inequalities","Gradients, Hessians, convexity","Lagrange multipliers, KKT, SGD, Adam, RMSprop","Asymptotic analysis, trees, graphs, sparse matrices","Parallel and concurrent programming"]],
["2","Core Machine Learning & Statistical Inference","Core ML",["Linear/logistic regression","Bias-variance tradeoff","L1/Lasso, L2/Ridge, ElasticNet","Decision trees and ensembles","Random Forest, Gradient Boosting, XGBoost, LightGBM","SVM and kernel methods","K-Means, hierarchical clustering, DBSCAN","GMM and Expectation-Maximization","PCA, t-SNE, UMAP","Stratified CV, PR, ROC-AUC, F1, calibration","Skewed distributions and leakage"]],
["3","Deep Learning Architectures","Deep learning",["MLP, forward/backpropagation","ReLU, GELU, Swish","Vanishing/exploding gradients","Batch/layer normalization and initialization","Convolution and receptive fields","ResNet, EfficientNet, ConvNeXt","YOLO, Faster R-CNN, Mask R-CNN","Visual SLAM basics","LSTM, GRU, sequence-to-sequence","Attention and self-attention","Multi-head and Encoder/Decoder Transformer families"]],
["4","Advanced Specializations","Specializations",["BPE and WordPiece","Static/contextual embeddings","NER, sequence classification, text generation","Cross-lingual representations","MDPs and Bellman equations","Dynamic programming and TD learning","Q-learning","REINFORCE, PPO, DDPG","Dense retrieval and vector indexing","HNSW, IVF, search architecture","Spark and Ray"]],
["5","Modern Generative AI & Agentic Systems","GenAI + agents",["VAEs and GANs","Score-based models and latent diffusion","PEFT, LoRA, QLoRA","Instruction tuning, DPO, RLHF","Multimodal embeddings","Milvus, Pinecone, Chroma","Advanced chunking and reranking","Semantic caching","ReAct and tool execution","Autonomous goal planning","LangGraph and CrewAI"]],
["6","System Design, Production & MLOps","Production",["INT8/FP4 quantization","Pruning and ONNX Runtime","TensorRT","vLLM and Triton Inference Server","Docker and Kubernetes","MLflow and model versioning","Feature stores","CI/CD for ML","Data and concept drift","Latency/throughput profiling","Bias audits","SHAP and LIME"]]
];
const P=[
["Custom Deep Learning Engine","Autograd engine and tensor library using Python + NumPy; backpropagation and custom optimizers."],
["Autonomous Vision & Perception Pipeline","Real-time object detection and lane-boundary estimation using YOLO and OpenCV on edge hardware."],
["Medical Image Segmentation & Diagnosis","3D imaging classification and tumor segmentation with 3D U-Net and Grad-CAM."],
["Audio Event Detection & Speech-to-Text","ASR pipeline with acoustic features and adaptation for low-resource Indian languages."],
["Streaming Fraud Detection Engine","Kafka + XGBoost anomaly detection with explicit low-latency measurement."],
["Production-Grade Enterprise RAG","Dense + BM25 retrieval, contextual chunking, reranking and guardrails."],
["Domain-Specific LLM Fine-Tuning","4-bit QLoRA adaptation of an open-weight model on specialist corpus data."],
["Autonomous Multi-Agent Researcher","LangGraph workflow for planning, web research, citation verification and reports."],
["Controllable Image Synthesis","Latent-diffusion pipeline conditioned on spatial edges and human poses."],
["High-Throughput Model Serving Cluster","Kubernetes inference service with vLLM, autoscaling and Prometheus/Grafana telemetry."],
["Continuous Learning & Drift Monitoring","MLflow + drift detection with automated dataset refresh/retraining workflow."],
["Master's Thesis / Capstone Solution","Research or industry project in areas such as agriculture imagery, robotics or protein modeling."]
];
const S=[
["Semester 1 / Foundation","Mathematical Foundations of AI; Advanced Data Structures & Algorithms; Foundations of Machine Learning; AI Programming Lab","Mathematical rigor, optimization, statistical inference, Python/C++ implementation."],
["Semester 2 / Core Deep Tech","Deep Learning; Convex Optimization; CV/NLP elective; Big Data Analytics/Speech elective","Neural-network implementations and large-scale representations."],
["Semester 3 / Specialization","RL/GenAI elective; Autonomous Navigation/Edge AI elective; Major Project Stage I","Research framing, specialization and baseline development."],
["Semester 4 / Culmination","Major Project Stage II; Thesis/Industry Capstone; Comprehensive Defense","Production deployment, benchmarking, scalable execution and viva."]
];
function e(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function done(k){return localStorage.getItem(k)==="1"}function pct(id){let a=M.find(x=>x[0]===id)[3],n=a.filter((_,i)=>done("l"+id+"-"+i)).length;return Math.round(n/a.length*100)}
function nav(){document.getElementById("nav").innerHTML=M.map(m=>'<button class="nav" id="n'+m[0]+'" onclick="module(\''+m[0]+'\')"><b>Module '+m[0]+'</b> · '+e(m[1])+'<small>'+e(m[2])+'</small></button>').join("")}
function shell(x){document.getElementById("main").innerHTML='<div>'+x+'</div>'}
function home(){shell('<section class="card hero"><div class="ey">Independent postgraduate-level study system</div><h1>From mathematical foundations to production AI.</h1><p class="lead">A complete A→Z independent curriculum based on the six-layer syllabus supplied for this project: mathematics, core ML, deep learning, advanced specializations, modern GenAI/agentic systems, and production MLOps.</p><div class="call"><b>Scope</b><br>This is an independent study system. It is not IIT admission, enrollment, a university degree, transcript or credential.</div><div class="actions"><button class="btn primary" onclick="module(\'1\')">Start Module 1</button><button class="btn" onclick="resume()">Resume</button><button class="btn" onclick="page(\'projects\')">Project Studio</button></div></section><div class="stats"><div class="card stat"><b>6</b><span>Core modules</span></div><div class="card stat"><b>'+M.reduce((a,m)=>a+m[3].length,0)+'</b><span>Topic units</span></div><div class="card stat"><b>'+P.length+'</b><span>Project directions</span></div></div><section class="card section"><div class="ey">A → Z curriculum</div><h2>The six-layer progression</h2><p>Build the foundations first, then increase abstraction: inference → learning → representation → generation/agents → production systems.</p><div class="grid">'+M.map(m=>'<article class="card module" onclick="module(\''+m[0]+'\')"><div class="ey">MODULE '+m[0]+'</div><h3>'+e(m[1])+'</h3><p>'+e(m[3].slice(0,4).join(" · "))+'…</p><span class="tag">'+e(m[2])+'</span><div class="bar"><i style="width:'+pct(m[0])+'%"></i></div><p>'+pct(m[0])+'% complete</p></article>').join("")+'</div></section><section class="card section"><div class="ey">Academic structure</div><h2>Four-semester map</h2><table class="table">'+S.map(x=>'<tr><th>'+e(x[0])+'</th><td>'+e(x[1])+'</td><td>'+e(x[2])+'</td></tr>').join("")+'</table></section>')}
function module(id){let m=M.find(x=>x[0]===id);document.querySelectorAll(".nav").forEach(x=>x.classList.remove("on"));document.getElementById("n"+id)?.classList.add("on");shell('<button class="btn" onclick="home()">← Curriculum</button><section class="card section"><div class="ey">Module '+id+' · '+e(m[2])+'</div><h1 style="font-size:50px">'+e(m[1])+'</h1><p class="lead">This module is studied from first principles: definition → mathematics → implementation → evaluation → failure modes.</p><div class="call"><b>Mastery standard</b><br>Do not mark a topic complete until you can explain the mechanism, implement a minimal example, identify assumptions and interpret a result.</div></section><section class="card section"><div class="ey">Topic sequence</div><h2>Study map</h2>'+m[3].map((t,i)=>'<div class="lesson" onclick="lesson(\''+id+'\','+i+')"><div><b>'+String(i+1).padStart(2,"0")+' · '+e(t)+'</b><small>Definition · intuition · implementation · evaluation · failure modes</small></div><span class="check '+(done("l"+id+"-"+i)?"done":"")+'">'+(done("l"+id+"-"+i)?"✓":"")+'</span></div>').join("")+'</section>')}
function lesson(id,i){let m=M.find(x=>x[0]===id),t=m[3][i],special=(id==="1"&&i===0)?'<section class="card section"><h2>Linear algebra as representation</h2><p>Vectors represent points, features or parameters; matrices represent linear transformations. Inner products measure alignment and projections decompose a vector relative to a subspace.</p><pre class="code">y = Ax
score = wᵀx
A = UΣVᵀ</pre><p>SVD is useful for low-rank approximation and dimensionality reduction. The important skill is connecting the decomposition to a concrete computational problem.</p></section>':(id==="2"&&i===1)?'<section class="card section"><h2>Bias–variance and regularization</h2><p>Bias reflects systematic underfitting; variance reflects sensitivity to the training sample. Regularization adds a penalty that constrains parameter complexity.</p><pre class="code">L = L_data + λΩ(θ)</pre><p>L1 promotes sparsity; L2 penalizes large coefficients smoothly; ElasticNet combines both.</p></section>':(id==="3"&&i===10)?'<section class="card section"><h2>Transformer attention</h2><p>Self-attention lets each position weight information from other positions.</p><pre class="code">Attention(Q,K,V) = softmax(QKᵀ / √dₖ)V</pre><p>Encoder-only, decoder-only and encoder-decoder designs support different classes of tasks.</p></section>':(id==="4"&&i===4)?'<section class="card section"><h2>Bellman perspective</h2><p>In an MDP, value is expressed recursively using immediate reward plus discounted future value.</p><pre class="code">V(s) = E[r + γV(s′) | s]</pre><p>TD learning updates estimates from sampled transitions; Q-learning learns action values.</p></section>':(id==="5"&&i===6)?'<section class="card section"><h2>Production RAG</h2><p>A robust RAG system separates ingestion, chunking, indexing, retrieval, reranking, context assembly, generation and evaluation.</p><pre class="code">query → retrieve → rerank → context → generate → cite/evaluate</pre><div class="call">When an answer is wrong, isolate retrieval failure, context failure and generation failure.</div></section>':(id==="6"&&i===4)?'<section class="card section"><h2>Production feedback loop</h2><p>After deployment, monitor data quality, model quality, latency, throughput, failures and drift. Monitoring is useful only when thresholds map to defined actions.</p></section>':'<section class="card section"><h2>First-principles study</h2><p>Define the object, its inputs and outputs, then connect the concept to its mathematical or system-level mechanism. Build the smallest possible example before using a large framework.</p><pre class="code"># experimental pattern
result = transform(input_data)
metric = evaluate(result)
print(metric)</pre><div class="call"><b>Challenge it.</b> Change one assumption, introduce an edge case, inspect the result and explain why it changed.</div></section>';shell('<button class="btn" onclick="module(\''+id+'\')">← Module '+id+'</button><div class="crumb">Module '+id+' · Lesson '+(i+1)+' / '+m[3].length+'</div><section class="card section"><div class="ey">Deep study</div><h1 style="font-size:48px">'+e(t)+'</h1><p class="lead">Study this topic as a mechanism, not a vocabulary item.</p></section>'+special+'<section class="card section"><h2>Checkpoint</h2><div class="call"><b>Professional habit:</b> a running program is not proof of correctness. Verify assumptions, test edge cases and interpret the metric.</div><button class="choice" onclick="answer(this,true)">Understand the mechanism and verify it with evidence.</button><button class="choice" onclick="answer(this,false)">Assume the output is correct because the code executed.</button><div id="fb" class="muted"></div></section><section class="card section"><h2>Your notes</h2><textarea class="note" id="note">'+e(localStorage.getItem("note-"+id+"-"+i)||"")+'</textarea><div class="actions"><button class="btn primary" onclick="save(\''+id+'\','+i+')">Save notes</button><button class="btn" onclick="complete(\''+id+'\','+i+')">Mark complete</button></div></section>')}
function answer(x,ok){document.querySelectorAll(".choice").forEach(b=>b.classList.remove("correct","wrong"));x.classList.add(ok?"correct":"wrong");document.getElementById("fb").textContent=ok?"Correct. Now explain why.":"Revisit definitions, assumptions and verification."}
function save(id,i){localStorage.setItem("note-"+id+"-"+i,document.getElementById("note").value);document.getElementById("status").textContent="Notes saved locally ✓"}
function complete(id,i){localStorage.setItem("l"+id+"-"+i,"1");document.getElementById("status").textContent="Lesson completed ✓";lesson(id,i)}
function resume(){for(let m of M)for(let i=0;i<m[3].length;i++)if(!done("l"+m[0]+"-"+i))return lesson(m[0],i);module("6")}
function page(p){document.querySelectorAll(".nav").forEach(x=>x.classList.remove("on"));if(p==="projects")shell('<section class="card section"><div class="ey">Project Studio</div><h1 style="font-size:54px">Build systems, not demos.</h1><p class="lead">A project ladder spanning low-level learning, perception, medical imaging, speech, streaming ML, RAG, fine-tuning, agents, generative vision and production infrastructure.</p></section><section class="card section"><div class="grid">'+P.map((x,i)=>'<article class="card project"><div class="ey">PROJECT '+String(i+1).padStart(2,"0")+'</div><h3>'+e(x[0])+'</h3><p>'+e(x[1])+'</p><span class="tag">Build · Measure · Explain</span></article>').join("")+'</div></section>');else if(p==="academic")shell('<section class="card section"><div class="ey">Academic structure</div><h1 style="font-size:54px">Four semesters.</h1><p class="lead">A pacing map for this independent curriculum, not an official university degree plan.</p></section>'+S.map(x=>'<section class="card section"><h2>'+e(x[0])+'</h2><p><b>Coursework:</b> '+e(x[1])+'</p><p><b>Focus:</b> '+e(x[2])+'</p></section>').join(""));else shell('<section class="card section"><div class="ey">Reference</div><h1 style="font-size:54px">Glossary.</h1><div class="grid">'+["Autograd","Bayes","Backpropagation","Bias-variance","Calibration","Concept drift","Embeddings","Fine-tuning","HNSW","KKT","LoRA","MAP","MCP","MLE","PEFT","RAG","ReAct","SVD","TD learning","Vector store"].map(x=>'<article class="card project"><h3>'+x+'</h3><p>Define formally, explain intuitively, implement minimally, and identify failure modes.</p></article>').join("")+'</div></section>')}
function search(q){q=q.toLowerCase();document.querySelectorAll("#nav .nav").forEach((b,i)=>b.style.display=!q||b.textContent.toLowerCase().includes(q)?"block":"none");if(!q){home();return}let a=M.filter(m=>(m[1]+" "+m[2]+" "+m[3].join(" ")).toLowerCase().includes(q));shell('<section class="card section"><div class="ey">Search</div><h2>Results for “'+e(q)+'”</h2><div class="grid">'+a.map(m=>'<article class="card module" onclick="module(\''+m[0]+'\')"><div class="ey">MODULE '+m[0]+'</div><h3>'+e(m[1])+'</h3><p>'+e(m[2])+'</p></article>').join("")+'</div></section>')}
nav();home();
</script></body></html>
