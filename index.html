function modulePage(id){let m=M.find(x=>x[0]===String(id));document.querySelectorAll(".nav").forEach(x=>x.classList.remove("on"));$("#n"+id)?.classList.add("on");shell('<button class="btn" onclick="home()">← Curriculum</button><section class="card section"><div class="ey">Module '+id+' · '+esc(m[2])+'</div><h1 style="font-size:clamp(40px,5vw,62px);line-height:1;letter-spacing:-.06em;margin:9px 0 14px">'+esc(m[1])+'</h1><p class="lead">'+esc(m[2])+' is treated as a study domain, not a checklist. Each lesson has a formal layer, an implementation layer and an evidence layer.</p><div class="call"><b>Mastery rule</b><br>Do not mark complete until you can explain the mechanism, state assumptions, implement a minimal example, choose an evaluation method and describe failure modes.</div></section><section class="card section"><div class="ey">Lesson sequence</div><h2>Structured study units</h2>'+m[3].map((u,i)=>'<div class="lesson" onclick="lessonPage('+id+','+i+')"><span class="lessonNo">'+String(i+1).padStart(2,"0")+'</span><div><b>'+esc(u[0])+'</b><small>'+esc(u[1])+' · concept → mathematics → implementation → experiment</small></div><div class="lessonMeta">'+(done(m[0],i)?"Completed":"Study")+'</div><span class="check '+(done(m[0],i)?"done":"")+'">'+(done(m[0],i)?"✓":"")+'</span></div>').join("")+'</section>')}
function spec(t){const S={"Vector spaces, inner products & projections":["A vector is an element of a structured space. In machine learning it can represent an observation, parameter vector or learned representation. Inner products express alignment and projections express the closest component inside a subspace.","x ∈ ℝⁿ · ⟨x,y⟩ = xᵀy · projᵤ(x) = (xᵀu / uᵀu)u","import numpy as np\nx=np.array([3.,2.])\nu=np.array([1.,0.])\nprojection=(x@u)/(u@u)*u\nprint(projection)"],"Linear regression":["Linear regression models a continuous response as a parameterized linear function. Least squares chooses parameters by minimizing squared residuals; the useful understanding comes from assumptions, conditioning and residual diagnostics.","ŷ = wᵀx + b · argmin ||Xw-y||²","from sklearn.linear_model import LinearRegression\nmodel=LinearRegression().fit(X,y)\npred=model.predict(X_test)"],"Self-attention":["Self-attention lets each position construct a representation using information from other positions. Query, key and value projections create a learned compatibility mechanism.","Attention(Q,K,V) = softmax(QKᵀ / √dₖ)V","scores=(Q@K.T)/(Q.shape[-1]**0.5)\nweights=np.exp(scores-scores.max(-1,keepdims=True))\nweights/=weights.sum(-1,keepdims=True)\nout=weights@V"],"Bellman equations":["A value function decomposes future return recursively. This turns long-horizon reasoning into a local relationship between immediate reward and successor value.","Vπ(s)=Eπ[rₜ+γVπ(sₜ₊₁)|sₜ=s]","V=np.zeros(n_states)\nfor _ in range(100):\n    V=reward+gamma*P@V"],"LoRA & QLoRA":["Low-rank adaptation changes a small number of trainable parameters while keeping the base weights fixed. QLoRA adds quantized base weights to reduce memory requirements.","W′ = W + BA, with rank(BA) ≪ rank(W)","W_adapted=W+B@A\n# train A and B; keep W frozen"],"Data drift":["Data drift means the production input distribution changes relative to the training distribution. It is a signal that must be interpreted alongside data quality and model performance.","P_train(X) ≠ P_prod(X)","shift=np.abs(X_train.mean(0)-X_prod.mean(0))"],"RAG":["RAG is a measurable retrieval-and-generation pipeline. A wrong answer can originate in ingestion, chunking, retrieval, ranking, context construction, generation or evaluation.","query → retrieve → rerank → context → generate → evaluate","# pipeline sketch\nchunks=chunk(document)\nindex.add(embed(chunks))\ncandidates=index.search(embed(query))"]};return S[t]}
function lessonPage(mid,i){let m=M.find(x=>x[0]===String(mid)),u=m[3][i],sp=spec(u[0]),k="bp:"+mid+":"+i,note=localStorage.getItem("note:"+k)||"",is=done(mid,i);let intro=sp?sp[0]:"Study "+u[0]+" as a mechanism rather than a framework feature. Identify the problem it solves, the object it operates on, its assumptions and the evidence required to trust its output.";let formula=sp?sp[1]:"problem → assumptions → mechanism → objective → computation → evaluation";let code=sp?sp[2]:"# minimal implementation pattern\ninput_data = load_data()\nmodel = build_minimal_model()\noutput = model(input_data)\nmetric = evaluate(output)";shell('<button class="btn" onclick="modulePage('+mid+')">← Module '+mid+'</button><section class="card section reader"><div class="ey">Deep study unit · '+esc(u[1])+'</div><h1>'+esc(u[0])+'</h1><p class="lead">'+esc(intro)+'</p><div class="meter"><i style="width:'+(is?100:10)+'%"></i></div></section><section class="card section study"><div class="ey">01 · Understand</div><h2>Why this concept matters</h2><p>'+esc(intro)+'</p><div class="objective"><span>Definition</span><span>Intuition</span><span>Assumptions</span><span>Mechanism</span></div></section><section class="card section study"><div class="ey">02 · Formalize</div><h2>Mathematical structure</h2><div class="formula">'+esc(formula)+'</div><p class="muted">Identify every term, its domain or dimensions, and what changes when an assumption changes. Do not memorize notation without understanding the computation it represents.</p></section><section class="card section study"><div class="ey">03 · Implement</div><h2>Build the smallest useful experiment.</h2><pre class="code">'+esc(code)+'</pre><div class="call"><b>Engineering discipline:</b> inspect intermediate values, verify inputs, compare against a trusted baseline where possible, and measure runtime or resource use when relevant.</div></section><section class="card section study"><div class="ey">04 · Experiment</div><h2>Turn the concept into evidence.</h2><div class="step"><span class="stepNo">1</span><div><b>Establish a baseline</b><br><span class="muted">Record the simplest meaningful result before changing the system.</span></div></div><div class="step"><span class="stepNo">2</span><div><b>Change one variable</b><br><span class="muted">Vary a single assumption, hyperparameter or data property and record the result.</span></div></div><div class="step"><span class="stepNo">3</span><div><b>Evaluate and interpret</b><br><span class="muted">Separate the measured result from your interpretation and document uncertainty.</span></div></div></section><section class="card section study"><div class="ey">05 · Failure analysis</div><h2>Know how it can fail.</h2><p>Ask whether a surprising result came from data quality, an invalid assumption, the objective, optimization, implementation, evaluation design or deployment conditions. A plausible output is not evidence of validity.</p><div class="studyGrid"><article class="card study"><h3>Diagnostic question</h3><p class="muted">What observation would falsify your current explanation?</p></article><article class="card study"><h3>Reproducibility</h3><p class="muted">Can another run, seed, split or environment reproduce the conclusion?</p></article></div></section><section class="card section study"><div class="ey">06 · Research layer</div><h2>Ask a question the implementation cannot answer yet.</h2><p class="muted">Which assumption is most restrictive? What ablation or controlled experiment would test whether relaxing it improves the system? What limitation should be documented even if the metric improves?</p><div class="objective"><span>Baseline</span><span>Ablation</span><span>Reproducibility</span><span>Limitations</span></div></section><section class="card section study"><div class="ey">Assessment</div><h2>Checkpoint</h2><button class="choice" onclick="answer(this,true)">I can define the method, explain its mechanism and state its important assumptions.</button><button class="choice" onclick="answer(this,false)">The result looks plausible, so I can treat the method as understood.</button><div id="feedback" class="muted"></div><h3 style="margin-top:24px">Personal notebook</h3><textarea class="note" id="note">'+esc(note)+'</textarea><div class="actions"><button class="btn" onclick="saveNote('+mid+','+i+')">Save locally</button><button class="btn primary" onclick="complete('+mid+','+i+')">'+(is?"Completed ✓":"Mark lesson complete")+'</button></div></section>')}
function answer(b,ok){document.querySelectorAll(".choice").forEach(x=>x.classList.remove("correct","wrong"));b.classList.add(ok?"correct":"wrong");$("#feedback").textContent=ok?"Good. Now demonstrate it with an example or implementation.":"Return to the definition, mechanism and verification steps."}
function saveNote(m,i){localStorage.setItem("note:bp:"+m+":"+i,$("#note").value);$(".pill").textContent="Note saved locally ✓"}
function complete(m,i){localStorage.setItem("bp:"+m+":"+i,"1");$(".pill").textContent="Lesson completed ✓";lessonPage(m,i)}
function resume(){for(const m of M)for(let i=0;i<m[3].length;i++)if(!done(m[0],i)){lessonPage(m[0],i);return}modulePage(6)}
function page(p){if(p==="projects")shell('<section class="card section"><div class="ey">Project Studio</div><h1 style="font-size:clamp(42px,5vw,64px)">Build systems, not demos.</h1><p class="lead">A project ladder that forces implementation, measurement, failure analysis and system design.</p></section><section class="card section"><div class="grid">'+P.map((x,i)=>'<article class="card project"><div class="ey">PROJECT '+String(i+1).padStart(2,"0")+'</div><h3>'+esc(x[0])+'</h3><p class="muted">'+esc(x[1])+'</p><span class="tag">Build · Measure · Explain</span></article>').join("")+'</div></section>');else if(p==="academic")shell('<section class="card section"><div class="ey">Academic pacing</div><h1 style="font-size:clamp(42px,5vw,64px)">Four semesters.</h1><p class="lead">A pacing model for the independent curriculum, not an official university degree plan.</p></section>'+SEM.map(s=>'<section class="card section"><div class="ey">'+esc(s[0])+'</div><h2>Course structure</h2><p>'+esc(s[1])+'</p></section>').join(""));else shell('<section class="card section"><div class="ey">Reference</div><h1 style="font-size:clamp(42px,5vw,64px)">Glossary.</h1><p class="lead">Define terms formally, explain them intuitively and connect them to implementation and failure modes.</p></section><section class="card section"><div class="grid">'+["Autograd","Bayes theorem","Backpropagation","Bias–variance","Calibration","Concept drift","Embeddings","Fine-tuning","HNSW","KKT","LoRA","MAP","MLE","PEFT","RAG","ReAct","SVD","TD learning","Vector store","Quantization"].map(x=>'<article class="card project"><h3>'+x+'</h3><p class="muted">Definition → mechanism → implementation → limitation.</p></article>').join("")+'</div></section>')}
function search(q){q=q.trim().toLowerCase();if(!q){home();return}let r=[];M.forEach(m=>m[3].forEach((u,i)=>{if((m[1]+" "+u[0]+" "+u[1]).toLowerCase().includes(q))r.push([m,i])}));shell('<section class="card section"><div class="ey">Curriculum search</div><h2>Results for “'+esc(q)+'”</h2><p class="muted">'+r.length+' matching lessons.</p>'+r.map(x=>'<div class="lesson" onclick="lessonPage('+x[0][0]+','+x[1]+')"><span class="lessonNo">'+String(x[1]+1).padStart(2,"0")+'</span><div><b>'+esc(x[0][3][x[1]][0])+'</b><small>Module '+x[0][0]+' · '+esc(x[0][3][x[1]][1])+'</small></div></div>').join("")+'</section>')}
theme(localStorage.getItem("bp-theme")||"light");nav();home();
</script></body></html>
