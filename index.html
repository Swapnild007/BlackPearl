="card project"><h3>03 · Experiment</h3><p>Change variables, measure outcomes and analyze failure modes.</p></article><article class="card project"><h3>04 · Apply</h3><p>Connect the concept to projects, systems, interviews and research questions.</p></article></div></section>')}

<section class="card section studyBlock"><div class="ey">Concept · Linear algebra</div><h2>Vectors are the language of representation</h2><p class="muted">A vector is more than a list of numbers. In AI it can represent an observation, a feature embedding, a parameter set or a direction in a learned space. A matrix represents a transformation between coordinate spaces.</p><div class="formula">x ∈ ℝⁿ &nbsp;&nbsp; y = Ax &nbsp;&nbsp; ⟨x,y⟩ = xᵀy</div><p>Inner products give us a notion of alignment. Orthogonal projection lets us approximate a vector using a subspace. These ideas later reappear in least squares, PCA, embeddings and optimization.</p></section>
<section class="card section studyBlock"><div class="ey">Mathematical connection</div><h2>Projection → least squares → PCA</h2><div class="step"><span class="stepNo">1</span><div><b>Projection</b><br><span class="muted">Find the component of a vector that lies inside a chosen subspace.</span></div></div><div class="step"><span class="stepNo">2</span><div><b>Least squares</b><br><span class="muted">Choose parameters whose prediction is the closest projection of the observations onto the model space.</span></div></div><div class="step"><span class="stepNo">3</span><div><b>PCA</b><br><span class="muted">Find directions capturing maximal variance, connecting covariance structure to eigenvectors.</span></div></div></section>
<section class="card section studyBlock"><div class="ey">Minimal implementation</div><h2>See the geometry in NumPy</h2><pre class="code">import numpy as np

x = np.array([3., 2.])
u = np.array([1., 0.])
projection = (x @ u) / (u @ u) * u

print(projection)</pre><div class="call"><b>Experiment:</b> change the direction <code>u</code>. Predict the projection before running the code, then compare.</div></section>`;
else if(id==="2"&&i===0) content=`
<section class="card section studyBlock"><div class="ey">Concept · supervised learning</div><h2>Regression learns a mapping from evidence to target</h2><p class="muted">Linear regression assumes a parameterized relationship between features and a continuous target. Logistic regression instead models a probability through a link function and is commonly used for binary classification.</p><div class="formula">Linear: ŷ = wᵀx + b<br>Logistic: p(y=1|x) = σ(wᵀx+b)</div><p>The important question is not only how to fit parameters, but whether the assumptions, features, validation design and metric support the intended use.</p></section>`;
else if(id==="3"&&i===10) content=`
<section class="card section studyBlock"><div class="ey">Concept · Transformers</div><h2>Attention turns pairwise relevance into computation</h2><p class="muted">Self-attention allows every token representation to condition on other positions. Query, key and value projections create a learned mechanism for deciding which information matters.</p><div class="formula">Attention(Q,K,V) = softmax(QKᵀ / √dₖ)V</div><div class="studyGrid"><article class="card studyBlock"><h3>Why divide by √dₖ?</h3><p class="muted">The scaling controls the magnitude of dot products as the key/query dimension grows, helping keep the softmax in a useful numerical regime.</p></article><article class="card studyBlock"><h3>Why multiple heads?</h3><p class="muted">Different heads can learn different relational patterns, then their outputs are combined.</p></article></div></section>
<section class="card section studyBlock"><div class="ey">Architecture map</div><div class="objective"><span>Embeddings</span><span>Positional information</span><span>Q/K/V projections</span><span>Multi-head attention</span><span>Feed-forward block</span><span>Residual + normalization</span></div></section>`;
else if(id==="4"&&i===4) content=`
<section class="card section studyBlock"><div class="ey">Concept · reinforcement learning</div><h2>Bellman equations express recursive value</h2><p class="muted">An MDP describes states, actions, transitions and rewards. The Bellman perspective says that the value of a state can be decomposed into immediate reward plus discounted future value.</p><div class="formula">Vπ(s) = Eπ[rₜ + γVπ(sₜ₊₁) | sₜ=s]</div><p>This recursion is the conceptual bridge from dynamic programming to temporal-difference learning and Q-learning.</p></section>`;
else if(id==="5"&&i===6) content=`
<section class="card section studyBlock"><div class="ey">Concept · retrieval augmented generation</div><h2>RAG is a pipeline, not a prompt trick</h2><div class="objective"><span>Ingest</span><span>Chunk</span><span>Embed</span><span>Index</span><span>Retrieve</span><span>Rerank</span><span>Generate</span><span>Evaluate</span></div><div class="formula">query → retrieve → rerank → context → generate → evaluate</div><p class="muted">When an answer is wrong, diagnose the layer: retrieval failure, context construction failure, generation failure, or evaluation failure. This decomposition makes RAG systems measurable.</p></section>`;
else if(id==="6"&&i===8) content=`
<section class="card section studyBlock"><div class="ey">Concept · monitoring</div><h2>Drift is a change in the operating distribution</h2><p class="muted">A production model can degrade even when the code and model weights are unchanged. Monitor input distributions, target behavior when labels arrive, latency, throughput and failure rates.</p><div class="formula">Training distribution → production distribution → compare → threshold → action</div></section>`;
else content=`
<section class="card section studyBlock"><div class="ey">First principles</div><h2>Build the mental model before the framework</h2><p class="muted">Start by defining the object, inputs, outputs, assumptions and failure modes. Then connect the idea to mathematics and implement the smallest useful experiment.</p><div class="studyGrid"><article class="card studyBlock"><h3>Concept</h3><p class="muted">What problem does this method solve?</p></article><article class="card studyBlock"><h3>Mechanism</h3><p class="muted">What computation causes the behavior?</p></article><article class="card studyBlock"><h3>Experiment</h3><p class="muted">What single variable can you change?</p></article><article class="card studyBlock"><h3>Failure</h3><p class="muted">When does the method produce misleading results?</p></article></div></section>
<section class="card section studyBlock"><div class="ey">Implementation pattern</div><pre class="code">input
  ↓
transform / model
  ↓
prediction or representation
  ↓
metric
  ↓
inspect error
  ↓
change one assumption</pre></section>`;
shell(`<button class="btn back" onclick="module('${id}')">← Module ${id}</button><div class="crumb">Module ${id} · Lesson ${i+1} of ${m[3].length}</div>
<section class="card section studyHero"><div class="ey">Deep study unit</div><h1 style="font-size:clamp(40px,5vw,62px)">${esc(t)}</h1><p class="lead">Learn the mechanism, derive what matters, implement a minimal example, then test and critique it.</p><div class="meter"><i style="width:${doneNow?100:18}%"></i></div></section>
${content}
<section class="card section studyBlock"><div class="ey">Learning outcomes</div><h2>Before marking complete, you should be able to…</h2><div class="objective"><span>Define it</span><span>Explain the intuition</span><span>State key assumptions</span><span>Implement a minimal example</span><span>Choose an evaluation method</span><span>Describe failure modes</span></div></section>
<section class="card section studyBlock"><h2>Checkpoint</h2><button class="choice" onclick="answer(this,true)">I can explain the mechanism and describe how I would verify it.</button><button class="choice" onclick="answer(this,false)">The output looks plausible, so I will accept it.</button><div id="fb" class="muted"></div></section>
<section class="card section studyBlock"><h2>Personal notes</h2><textarea class="note" id="note">${esc(localStorage.getItem("note-"+id+"-"+i)||"")}</textarea><div class="actions"><button class="btn primary" onclick="saveNote('${id}',${i})">Save locally</button><button class="btn" onclick="complete('${id}',${i})">${doneNow?"Completed ✓":"Mark complete"}</button></div></section>`);
}
function answer(x,ok){document.querySelectorAll(".choice").forEach(b=>b.classList.remove("correct","wrong"));x.classList.add(ok?"correct":"wrong");document.getElementById("fb").textContent=ok?"Correct. Now explain why.":"Revisit definitions, assumptions and verification."}
function save(id,i){localStorage.setItem("note-"+id+"-"+i,document.getElementById("note").value);document.getElementById("status").textContent="Notes saved locally ✓"}
function complete(id,i){localStorage.setItem("l"+id+"-"+i,"1");document.getElementById("status").textContent="Lesson completed ✓";lesson(id,i)}
function resume(){for(let m of M)for(let i=0;i<m[3].length;i++)if(!done("l"+m[0]+"-"+i))return lesson(m[0],i);module("6")}
function page(p){document.querySelectorAll(".nav").forEach(x=>x.classList.remove("on"));if(p==="projects")shell('<section class="card section"><div class="ey">Project Studio</div><h1 style="font-size:54px">Build systems, not demos.</h1><p class="lead">A project ladder spanning low-level learning, perception, medical imaging, speech, streaming ML, RAG, fine-tuning, agents, generative vision and production infrastructure.</p></section><section class="card section"><div class="grid">'+P.map((x,i)=>'<article class="card project"><div class="ey">PROJECT '+String(i+1).padStart(2,"0")+'</div><h3>'+e(x[0])+'</h3><p>'+e(x[1])+'</p><span class="tag">Build · Measure · Explain</span></article>').join("")+'</div></section>');else if(p==="academic")shell('<section class="card section"><div class="ey">Academic structure</div><h1 style="font-size:54px">Four semesters.</h1><p class="lead">A pacing map for this independent curriculum, not an official university degree plan.</p></section>'+S.map(x=>'<section class="card section"><h2>'+e(x[0])+'</h2><p><b>Coursework:</b> '+e(x[1])+'</p><p><b>Focus:</b> '+e(x[2])+'</p></section>').join(""));else shell('<section class="card section"><div class="ey">Reference</div><h1 style="font-size:54px">Glossary.</h1><div class="grid">'+["Autograd","Bayes","Backpropagation","Bias-variance","Calibration","Concept drift","Embeddings","Fine-tuning","HNSW","KKT","LoRA","MAP","MCP","MLE","PEFT","RAG","ReAct","SVD","TD learning","Vector store"].map(x=>'<article class="card project"><h3>'+x+'</h3><p>Define formally, explain intuitively, implement minimally, and identify failure modes.</p></article>').join("")+'</div></section>')}
function search(q){q=q.toLowerCase();document.querySelectorAll("#nav .nav").forEach((b,i)=>b.style.display=!q||b.textContent.toLowerCase().includes(q)?"block":"none");if(!q){home();return}let a=M.filter(m=>(m[1]+" "+m[2]+" "+m[3].join(" ")).toLowerCase().includes(q));shell('<section class="card section"><div class="ey">Search</div><h2>Results for “'+e(q)+'”</h2><div class="grid">'+a.map(m=>'<article class="card module" onclick="module(\''+m[0]+'\')"><div class="ey">MODULE '+m[0]+'</div><h3>'+e(m[1])+'</h3><p>'+e(m[2])+'</p></article>').join("")+'</div></section>')}
initTheme();nav();home();
</script></body></html>
