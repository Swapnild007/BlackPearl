<style>
:root{--bg:#f5f3ff;--bg2:#eef2ff;--card:rgba(255,255,255,.82);--ink:#171725;--muted:#6b6b7c;--line:#e7e5f0;--accent:#635bff;--accent2:#8b5cf6;--good:#18875a;--shadow:0 18px 55px rgba(38,35,75,.09);--radius:24px}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:radial-gradient(circle at 10% 0,#fff 0,transparent 28%),linear-gradient(145deg,var(--bg),var(--bg2));color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text",Inter,system-ui,sans-serif;line-height:1.65}
button,input{font:inherit}button{cursor:pointer}.app{min-height:100vh}.top{position:sticky;top:0;z-index:30;background:rgba(247,246,252,.82);backdrop-filter:blur(22px);border-bottom:1px solid rgba(220,218,232,.7)}.topin{max-width:1180px;margin:auto;padding:13px 18px;display:flex;align-items:center;gap:14px}.brand{font-weight:800;letter-spacing:-.03em}.brand span{color:var(--accent)}.pill{margin-left:auto;border:1px solid var(--line);background:#fff9;border-radius:999px;padding:7px 12px;color:var(--muted);font-size:12px}
.layout{max-width:1180px;margin:auto;padding:28px 18px 80px;display:grid;grid-template-columns:285px minmax(0,1fr);gap:24px}.side{position:sticky;top:74px;height:calc(100vh - 100px);overflow:auto;padding-right:4px}.sidecard,.card{background:var(--card);border:1px solid rgba(255,255,255,.8);box-shadow:var(--shadow);border-radius:var(--radius)}.sidecard{padding:14px}.navtitle{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);padding:8px 10px}.navbtn{width:100%;text-align:left;border:0;background:transparent;padding:10px;border-radius:14px;color:#464655}.navbtn:hover,.navbtn.active{background:#fff;box-shadow:0 6px 20px #423b7a12;color:var(--accent)}.navbtn small{display:block;color:var(--muted);font-size:10px}
.hero{padding:36px 30px;background:linear-gradient(135deg,#fff,.f7f5ff);position:relative;overflow:hidden}.hero:after{content:"";position:absolute;width:220px;height:220px;border-radius:50%;right:-60px;top:-80px;background:linear-gradient(135deg,#8b5cf633,#635bff18)}.eyebrow{font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.12em;color:var(--accent)}h1{font-size:clamp(38px,6vw,72px);line-height:1.02;letter-spacing:-.055em;margin:10px 0 16px;max-width:850px}h2{font-size:30px;line-height:1.15;letter-spacing:-.035em;margin:0 0 12px}h3{font-size:20px;margin:22px 0 8px}.lead{font-size:18px;color:#555565;max-width:780px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:18px}.stat{padding:18px}.stat b{font-size:27px;display:block}.stat span{font-size:12px;color:var(--muted)}.section{margin-top:22px;padding:25px}.section p{color:#555565}.modulegrid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}.module{padding:20px;transition:.22s transform,.22s box-shadow}.module:hover{transform:translateY(-2px);box-shadow:0 24px 60px rgba(38,35,75,.12)}.module .num{font-size:12px;color:var(--accent);font-weight:800}.module h3{margin:5px 0;font-size:19px}.module p{margin:6px 0;color:var(--muted);font-size:14px}.tag{display:inline-block;padding:4px 8px;border-radius:999px;background:#f0edff;color:#5b4ee8;font-size:10px;font-weight:800;margin-top:8px}.progress{height:7px;background:#eceaf3;border-radius:99px;overflow:hidden;margin-top:13px}.progress i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));border-radius:inherit;width:0}
.actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:18px}.btn{border:1px solid var(--line);background:#fff;border-radius:14px;padding:10px 14px;font-weight:750;color:#353544}.btn.primary{background:var(--accent);color:white;border-color:var(--accent)}.btn.ghost{background:transparent}.reader{animation:in .35s ease}@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.callout{border-left:4px solid var(--accent);background:#f4f1ff;padding:15px 17px;border-radius:14px;margin:16px 0}.callout strong{display:block;margin-bottom:3px}.code{background:#15151d;color:#e8e8ef;padding:18px;border-radius:16px;overflow:auto;font:13px/1.7 ui-monospace,SFMono-Regular,Menlo,monospace}.code .kw{color:#b8a7ff}.code .str{color:#b9e6b1}.table{width:100%;border-collapse:collapse;font-size:14px}.table th,.table td{padding:11px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}.quiz{padding:18px;border:1px solid var(--line);border-radius:18px;background:#fff;margin-top:12px}.choice{display:block;width:100%;text-align:left;border:1px solid var(--line);background:#fafafd;padding:11px 13px;border-radius:12px;margin:7px 0}.choice.correct{border-color:#63b98f;background:#effbf5}.choice.wrong{border-color:#d98787;background:#fff3f3}.note{width:100%;min-height:110px;border:1px solid var(--line);border-radius:16px;padding:14px;background:#fff;resize:vertical}.search{width:100%;border:1px solid var(--line);background:#fff;border-radius:14px;padding:11px 13px;margin:5px 0 12px}.muted{color:var(--muted)}.crumb{font-size:12px;color:var(--muted);margin-bottom:8px}.back{margin-bottom:12px}.lessonlist{display:grid;gap:9px}.lessonitem{padding:14px;border:1px solid var(--line);border-radius:16px;background:#fff;display:flex;gap:12px;align-items:center}.lessonitem b{font-size:14px}.check{margin-left:auto;width:22px;height:22px;border-radius:50%;border:1px solid var(--line);background:white}.check.done{background:var(--good);border-color:var(--good);color:#fff;display:grid;place-items:center}.footer{text-align:center;color:var(--muted);font-size:12px;margin-top:30px}
@media(max-width:850px){.layout{display:block;padding:16px 12px 70px}.side{position:static;height:auto;margin-bottom:14px}.sidecard{display:flex;gap:5px;overflow:auto}.navtitle,.search{display:none}.navbtn{min-width:max-content}.navbtn small{display:none}.grid,.modulegrid{grid-template-columns:1fr}.hero{padding:28px 21px}.section{padding:20px}h1{font-size:43px}.pill{display:none}}

<body>
<div class="app">
<header class="top"><div class="topin"><div class="brand">AI/ML <span>Command School</span></div><div class="pill" id="status">Offline-ready · local progress</div></div></header>
<div class="layout">
<aside class="side"><div class="sidecard">
<input class="search" id="search" placeholder="Search curriculum…" oninput="filterModules(this.value)">

</div></aside>
<main id="main"></main>
</div></div>
<script>
const modules=[
["01","AI, ML & Agentic AI Journey","Foundations","Roadmap, outcomes, mathematics & statistics essentials."],
["02","Python Refresher with AI","Python","Syntax, data structures, functions, OOP, files, errors and AI-assisted coding."],
["03","Applied Data Science: Analysis & Visualization","Data Science","NumPy, Pandas, statistics, wrangling and visualization."],
["04","Statistics & Feature Engineering for Machine Learning","Statistics","Linear algebra, probability, inference, tests and feature engineering."],
["05","Machine Learning: Supervised, Unsupervised & Beyond","Machine Learning","Regression, classification, ensembles, clustering, dimensionality reduction and anomaly detection."],
["06","Deep Learning with Keras & TensorFlow","Deep Learning","Neural networks, optimization, CNNs, transfer learning, RNNs and autoencoders."],
["07","NLP, Transformers & Speech Recognition","NLP","Text processing, embeddings, translation, Transformers, BERT/GPT and speech."],
["08","Generative AI Foundations & Prompt Engineering","GenAI","VAEs, GANs, attention, RAG, LLMs, LangChain and prompting."],
["09","Building LLM Applications: RAG, Agents & Fine-Tuning","LLM Apps","Vector stores, agents, tools, fine-tuning, Hugging Face and evaluation."],
["10","ML in Production: MLOps & Cloud Deployment","MLOps","MLflow, deployment, monitoring, automation, IaC, drift, governance and security."],
["11","Agentic AI Frameworks with MCP Protocol","Agentic AI","MCP concepts, FastMCP, context, guardrails and security."],
["12","Knowledge-Enhanced AI Agents with Foundry IQ","Knowledge AI","RAG knowledge platforms, Azure sources, retrieval, testing and monitoring."],
["13","Capstone Project","Capstone","End-to-end problem framing, architecture, implementation, evaluation and delivery."]
];
const lessons={
"01":[["AI hierarchy","AI, ML, deep learning, generative AI and agentic systems"],["Mathematical foundations","Functions, derivatives, vectors, probability and uncertainty"],["Statistics essentials","Distributions, sampling, hypothesis testing and confidence intervals"],["Learning strategy","How to move from concept → implementation → evaluation"]],
"02":[["Python foundations","Syntax, variables, types, operators and execution"],["Data structures","Lists, tuples, dictionaries, sets and comprehensions"],["Control flow","Conditions, loops and practical iteration"],["Functions","Parameters, return values, scope and reusable modules"],["OOP","Classes, objects, inheritance and composition"],["Files & errors","Paths, text/CSV/JSON, exceptions and debugging"],["AI-assisted coding","Prompting, review, testing, optimization, ethics and licensing"]],
"03":[["Data science workflow","Question → data → cleaning → analysis → communication"],["NumPy","Arrays, shapes, indexing, slicing and vectorized computation"],["Pandas","Series, DataFrames, joins, grouping and time data"],["Data quality","Missing values, duplicates, outliers and type consistency"],["Visualization","Matplotlib, Seaborn and Plotly; choosing the right chart"]],
"04":[["Linear algebra","Vectors, matrices, matrix operations and eigen concepts"],["Descriptive statistics","Center, spread, shape and relationships"],["Probability","Random variables, distributions and conditional probability"],["Inference","Sampling, confidence intervals and p-values"],["Hypothesis tests","t-test, z-test, chi-square, ANOVA and F-test"],["Feature engineering","Scaling, encoding, transformations and leakage control"]],
"05":[["ML foundations","Learning paradigms, features, targets and evaluation"],["Regression","Linear and polynomial regression, metrics and tuning"],["Classification","Logistic regression, Naive Bayes, KNN, trees and SVM"],["Ensembles","Random forests, bagging, boosting and stacking"],["Imbalanced data","Class weights, resampling and suitable metrics"],["Unsupervised learning","Clustering and representation discovery"],["Dimensionality reduction","PCA, LDA and t-SNE"],["Anomaly & recommendation","Outlier detection and recommendation foundations"]],
"06":[["Neural networks","Layers, activations, forward pass and loss"],["Backpropagation","Gradients, chain rule and gradient descent"],["Frameworks","TensorFlow, Keras and PyTorch mental models"],["Optimization","SGD, Adam, RMSProp, batch normalization"],["Regularization","Dropout, early stopping and generalization"],["CNNs","Convolution, pooling, feature maps and transfer learning"],["Sequence models","RNN, LSTM and GRU"],["Autoencoders","Reconstruction learning and representation compression"]],
"07":[["NLP pipeline","Tokenization, normalization, stemming and lemmatization"],["Text features","BoW, TF-IDF and sparse representations"],["Embeddings","Word2Vec, GloVe and semantic geometry"],["Translation","Seq2Seq and evaluation metrics"],["Transformers","Attention, encoder/decoder architecture and context"],["BERT & GPT","Bidirectional understanding vs autoregressive generation"],["Speech","DSP, Fourier transform, MFCCs and recognition pipelines"]],
"08":[["Generative model families","VAEs, GANs, Transformers and diffusion-era context"],["Attention","Self-attention and multi-head attention"],["LLM architecture","Tokens, embeddings, transformer blocks and generation"],["RAG","Retrieval, context assembly and grounded generation"],["LangChain concepts","Models, prompts, memory and chains"],["Prompt engineering","Zero-shot, few-shot, structured prompts and reasoning controls"]],
"09":[["RAG application stack","Loaders, splitters, embeddings and vector stores"],["Retrieval","Similarity search, metadata filters and reranking"],["Chains & memory","Composable application workflows and conversational state"],["Agents","Tool selection, planning loops and action boundaries"],["Fine-tuning","Supervised fine-tuning, PEFT and RLHF concepts"],["Hugging Face stack","Transformers, Accelerate and DeepSpeed roles"],["Evaluation","ROUGE, GLUE, SuperGLUE, HELM and task-specific evaluation"],["Safety","Bias mitigation, hallucination controls and red-team thinking"]],
"10":[["MLOps lifecycle","Development, validation, release, monitoring and iteration"],["Experiment tracking","MLflow runs, parameters, metrics and artifacts"],["Deployment","Batch, online and API-serving architectures"],["Monitoring","Latency, quality, drift and feedback loops"],["Automation","Pipelines, orchestration and reproducibility"],["Infrastructure as code","Step Functions, CloudFormation and Terraform concepts"],["Governance","Security, compliance, access control and auditability"]],
"11":[["Why MCP","A protocol layer for model-to-tool/context interaction"],["MCP vs APIs","Where protocolized tool access fits in an agent stack"],["FastMCP","Tool registration, hosting and discoverability"],["Context architecture","Structured context, system prompts and persistence"],["Guardrails","Validation, permissions, tool boundaries and failure handling"],["Security","Authentication, token management, context poisoning and data leakage"]],
"12":[["Knowledge problem","Why static model knowledge is insufficient for changing enterprise data"],["Foundry IQ","Shared knowledge infrastructure for multiple agents"],["Data sources","Azure AI Search, Blob Storage, SharePoint and OneLake"],["Retrieval behavior","Grounding, citations, instructions and relevance"],["Integration","Connect agents to knowledge and test retrieval quality"],["Production monitoring","Observability, failure analysis and continuous improvement"]],
"13":[["Problem framing","Define users, objective, constraints and success metrics"],["Data & architecture","Acquire data, design pipeline and choose model strategy"],["Build","Implement baseline, iterate and document decisions"],["Evaluation","Measure quality, robustness, cost and latency"],["Deployment","Package the solution and expose a usable interface"],["Final delivery","README, architecture, demo, limitations and future work"]]
};
const detail={
"01":"The opening block establishes the mental model for the entire journey. Treat AI as a family of methods, ML as a data-driven learning approach, deep learning as neural-network-based representation learning, generative AI as systems that synthesize content, and agentic systems as applications that can select tools and execute multi-step workflows.",
"02":"Python is the working language used throughout the program. The goal is not memorizing syntax; it is learning to express data transformations, model workflows and automation clearly enough that you can test and maintain them.",
"03":"Data science turns raw observations into evidence. A good workflow separates data acquisition, validation, cleaning, exploration, analysis and communication so that a chart never hides a data-quality problem.",
"04":"Statistics and feature engineering determine what information a model receives and how uncertainty is interpreted. A strong practitioner understands both the mathematics and the assumptions behind a metric or test.",
"05":"Machine learning is the disciplined process of learning patterns from data and evaluating whether they generalize. Model selection is only one part of the job; leakage, baselines, validation and metric choice matter just as much.",
"06":"Deep learning learns representations through layered differentiable functions. Understanding tensors, losses, gradients and optimization gives you a transferable foundation across computer-vision and sequence architectures.",
"07":"NLP converts language and speech into representations that computational models can process. Transformers changed the field by making attention a central mechanism for modeling relationships across a sequence.",
"08":"Generative AI foundations connect classical neural architectures to modern LLM applications. The key skill is understanding what a model knows, what retrieval supplies, and how prompts shape the interface between the two.",
"09":"LLM applications are systems engineering as much as model usage. Retrieval, tools, memory, evaluation and fine-tuning each solve different problems and must be composed deliberately.",
"10":"Production ML introduces operational constraints: reproducibility, latency, monitoring, security, cost and governance. A model that works in a notebook is not automatically a production system.",
"11":"MCP provides a standardized way to expose tools and contextual resources to compatible AI applications. The learning emphasis is on boundaries, structured context, discoverability and secure tool execution.",
"12":"Knowledge-enhanced agents combine retrieval infrastructure with agent instructions so responses can be grounded in current organizational information. Retrieval quality and monitoring become first-class engineering concerns.",
"13":"The capstone is where the layers become one system: problem definition, data, model or agent architecture, evaluation, deployment and documentation."
};
function esc(s){return s.replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function key(m){return "done-"+m}
function nav(){document.getElementById("nav").innerHTML=modules.map(m=>'<button class="navbtn" onclick="openModule(\''+m[0]+'\')" id="n'+m[0]+'"><b>'+m[0]+'</b> · '+esc(m[1])+'<small>'+m[2]+'</small></button>').join("")}
function pct(id){let a=lessons[id]||[],d=a.filter((_,i)=>localStorage.getItem("done-"+id+"-"+i)==="1").length;return a.length?Math.round(d/a.length*100):0}
function dashboard(){document.getElementById("main").innerHTML='<div class="reader"><section class="card hero"><div class="eyebrow">Offline self-learning environment</div><h1>Build the AI mind.<br>Then build the systems.</h1><p class="lead">A structured, independent learning environment following the published AI/ML + Generative AI + Agentic AI learning path. No credential is implied; this is your private study system.</p><div class="actions"><button class="btn primary" onclick="openModule(\'01\')">Start learning</button><button class="btn" onclick="resume()">Resume</button></div></section><div class="grid"><div class="card stat"><b>'+modules.length+'</b><span>Core learning blocks</span></div><div class="card stat"><b>70+</b><span>Structured lessons</span></div><div class="card stat"><b>100%</b><span>Offline local progress</span></div></div><section class="card section"><div class="eyebrow">Curriculum</div><h2>The complete learning path</h2><p>Study in order. Each block is deliberately layered so mathematics and programming support data science, ML, deep learning, NLP, GenAI, LLM applications, MLOps and agentic systems.</p><div class="modulegrid" id="modules"></div></section><section class="card section"><div class="eyebrow">Practice philosophy</div><h2>Learn → build → test → explain</h2><div class="callout"><strong>Rule for this school</strong>Do not treat generated code as correct because it runs. Read it, test it, explain it, and change it deliberately.</div><table class="table"><tr><th>Stage</th><th>What you do</th></tr><tr><td>Learn</td><td>Understand the concept and its assumptions.</td></tr><tr><td>Build</td><td>Implement a small working example.</td></tr><tr><td>Test</td><td>Use edge cases, metrics and validation.</td></tr><tr><td>Explain</td><td>Write what happened and why.</td></tr></table></section><div class="footer">Curriculum reference: current Simplilearn/I-DAPT IIT(BHU) published program page. Content here is original study material, not provider course text.</div></div>';renderModules()}
function renderModules(q=""){let el=document.getElementById("modules");if(!el)return;let list=modules.filter(m=>(m[1]+" "+m[2]+" "+m[3]).toLowerCase().includes(q.toLowerCase()));el.innerHTML=list.map(m=>'<article class="card module" onclick="openModule(\''+m[0]+'\')"><div class="num">MODULE '+m[0]+'</div><h3>'+esc(m[1])+'</h3><p>'+esc(m[3])+'</p><span class="tag">'+m[2]+'</span><div class="progress"><i style="width:'+pct(m[0])+'%"></i></div><p class="muted">'+pct(m[0])+'% complete</p></article>').join("")||'<p class="muted">No matching modules.</p>'}
function filterModules(q){renderModules(q);document.querySelectorAll(".navbtn").forEach(b=>b.style.display=q?"none":"block")}
function openModule(id){let m=modules.find(x=>x[0]===id), ls=lessons[id]||[];document.getElementById("main").innerHTML='<div class="reader"><button class="btn back" onclick="dashboard()">← Curriculum</button><div class="crumb">Module '+m[0]+' · '+esc(m[2])+'</div><section class="card section"><div class="eyebrow">Study material</div><h1 style="font-size:48px">'+esc(m[1])+'</h1><p class="lead">'+esc(detail[id])+'</p><div class="callout"><strong>Outcome</strong>By the end of this block you should be able to explain the core ideas, implement small examples, evaluate your work and identify where the method fails.</div></section><section class="card section"><div class="eyebrow">Lesson map</div><h2>What to study</h2><div class="lessonlist">'+ls.map((x,i)=>'<div class="lessonitem" onclick="openLesson(\''+id+'\','+i+')"><div><b>'+String(i+1).padStart(2,"0")+' · '+esc(x[0])+'</b><div class="muted" style="font-size:12px">'+esc(x[1])+'</div></div><span class="check '+(localStorage.getItem("done-"+id+"-"+i)==="1"?"done":"")+'">'+(localStorage.getItem("done-"+id+"-"+i)==="1"?"✓":"")+'</span></div>').join("")+'</div></section></div>';document.querySelectorAll(".navbtn").forEach(x=>x.classList.remove("active"));document.getElementById("n"+id)?.classList.add("active")}
function openLesson(id,i){let m=modules.find(x=>x[0]===id),x=lessons[id][i];let body=lessonBody(id,i,x[0]);document.getElementById("main").innerHTML='<div class="reader"><button class="btn back" onclick="openModule(\''+id+'\')">← Module '+id+'</button><div class="crumb">'+esc(m[1])+' · Lesson '+(i+1)+'</div><section class="card section"><div class="eyebrow">Lesson '+String(i+1).padStart(2,"0")+'</div><h1 style="font-size:46px">'+esc(x[0])+'</h1><p class="lead">'+esc(x[1])+'.</p></section>'+body+'<section class="card section"><h2>Checkpoint</h2><div class="quiz"><b>Which statement best describes the learning goal?</b><button class="choice" onclick="answer(this,true)">Understand the mechanism and its assumptions, then verify it in practice.</button><button class="choice" onclick="answer(this,false)">Memorize the API names without testing the result.</button><button class="choice" onclick="answer(this,false)">Assume generated output is correct if it executes.</button><div class="muted" id="feedback" style="margin-top:10px"></div></div></section><section class="card section"><h2>Your notes</h2><textarea class="note" id="note" placeholder="Write your own explanation, questions, formulas or examples…"></textarea><div class="actions"><button class="btn primary" onclick="saveNote(\''+id+'\','+i+')">Save notes</button><button class="btn" onclick="complete(\''+id+'\','+i+')">Mark lesson complete</button></div></section></div>';let n=localStorage.getItem("note-"+id+"-"+i);if(n)document.getElementById("note").value=n}
function lessonBody(id,i,title){let common='<section class="card section"><h2>Core idea</h2><p>Start with the smallest useful mental model. Define the inputs, the transformation, the output and the assumptions. Then compare that model with a concrete implementation.</p><div class="callout"><strong>Study habit</strong>After reading this section, close the page and explain the concept in your own words before looking at the example again.</div></section>';if(id==="02"&&i===0)return common+'<section class="card section"><h2>Python execution model</h2><p>Python source is parsed and executed by the interpreter. Names refer to objects; assignment binds a name to an object rather than copying a value in the abstract.</p><pre class="code"><span class="kw">name</span> = <span class="str">"Ada"</span>
age = 36
print(f"{name} is {age}")</pre><h3>What to notice</h3><p>Strings, integers and booleans are different types. Your job is to know what operations are valid, what conversions are explicit, and what errors should be expected.</p></section>';if(id==="03"&&i===1)return common+'<section class="card section"><h2>Vectorized thinking with NumPy</h2><p>Arrays let you express operations over many values without manually writing a Python loop for every element.</p><pre class="code"><span class="kw">import</span> numpy as np

scores = np.array([72, 81, 65, 90])
mean = scores.mean()
centered = scores - mean</pre><p>The important idea is shape-aware computation. Always inspect dimensions before assuming an operation will broadcast as intended.</p></section>';if(id==="04"&&i===4)return common+'<section class="card section"><h2>Hypothesis testing</h2><p>A test starts with a null hypothesis and a statistic whose behavior is understood under that null. A p-value measures how surprising the observed result would be under the null; it is not the probability that the null is true.</p><div class="callout"><strong>Do not overclaim</strong>A small p-value does not automatically imply practical importance. Effect size, uncertainty, sample size and domain context still matter.</div></section>';if(id==="05"&&i===1)return common+'<section class="card section"><h2>Regression as function fitting</h2><p>In linear regression, the model predicts a target from a weighted combination of features. Training chooses parameters that minimize a loss on the training data.</p><pre class="code">y_hat = w1*x1 + w2*x2 + b

error = y - y_hat</pre><p>Separate training and evaluation data. Otherwise the reported metric can be optimistic because the model has indirectly seen the answers.</p></section>';if(id==="06"&&i===1)return common+'<section class="card section"><h2>Backpropagation</h2><p>Backpropagation applies the chain rule to compute how each parameter contributed to the loss. An optimizer then uses those gradients to update parameters.</p><div class="callout"><strong>Core loop</strong>forward pass → loss → backward pass → parameter update → repeat.</div></section>';if(id==="07"&&i===4)return common+'<section class="card section"><h2>Self-attention</h2><p>Attention lets each token construct a weighted combination of information from other tokens. Query, key and value projections provide the mechanism for deciding which context matters.</p><pre class="code">Attention(Q,K,V) = softmax(QKᵀ / √dₖ)V</pre><p>Multi-head attention repeats this idea across several learned projections so the model can represent different relationships in parallel.</p></section>';if(id==="08"&&i===3)return common+'<section class="card section"><h2>Retrieval-augmented generation</h2><p>RAG separates retrieval from generation. A query is transformed into a representation, relevant chunks are retrieved, and those chunks are supplied as context to a language model.</p><div class="callout"><strong>Key engineering question</strong>When an answer is wrong, determine whether retrieval failed, context assembly failed, or generation ignored good evidence.</div></section>';if(id==="09"&&i===3)return common+'<section class="card section"><h2>Agents and tools</h2><p>An agent application gives a model access to tools and an execution loop. Tool schemas constrain what can be requested; the application remains responsible for authorization, validation and side effects.</p><pre class="code">user → model → tool selection → validation → tool → result → model → response</pre></section>';if(id==="10"&&i===1)return common+'<secti
