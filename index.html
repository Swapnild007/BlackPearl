function modulePage(id){let m=M.find(x=>x[0]===String(id));document.querySelectorAll(".nav").forEach(x=>x.classList.remove("on"));$("#n"+id)?.classList.add("on");shell('<button class="btn" onclick="home()">← Curriculum</button><section class="card section"><div class="ey">Module '+id+' · '+esc(m[2])+'</div><h1 style="font-size:clamp(40px,5vw,62px);line-height:1;letter-spacing:-.06em;margin:9px 0 14px">'+esc(m[1])+'</h1><p class="lead">'+esc(m[2])+' is treated as a study domain, not a checklist. Each lesson has a formal layer, an implementation layer and an evidence layer.</p><div class="call"><b>Mastery rule</b><br>Do not mark complete until you can explain the mechanism, state assumptions, implement a minimal example, choose an evaluation method and describe failure modes.</div></section><section class="card section"><div class="ey">Lesson sequence</div><h2>Structured study units</h2>'+m[3].map((u,i)=>'<div class="lesson" onclick="lessonPage('+id+','+i+')"><span class="lessonNo">'+String(i+1).padStart(2,"0")+'</span><div><b>'+esc(u[0])+'</b><small>'+esc(u[1])+' · concept → mathematics → implementation → experiment</small></div><div class="lessonMeta">'+(done(m[0],i)?"Completed":"Study")+'</div><span class="check '+(done(m[0],i)?"done":"")+'">'+(done(m[0],i)?"✓":"")+'</span></div>').join("")+'</section>')}
function spec(t){const S={"Vector spaces, inner products & projections":["A vector is an element of a structured space. In machine learning it can represent an observation, parameter vector or learned representation. Inner products express alignment and projections express the closest component inside a subspace.","x ∈ ℝⁿ · ⟨x,y⟩ = xᵀy · projᵤ(x) = (xᵀu / uᵀu)u","import numpy as np\nx=np.array([3.,2.])\nu=np.array([1.,0.])\nprojection=(x@u)/(u@u)*u\nprint(projection)"],"Linear regression":["Linear regression models a continuous response as a parameterized linear function. Least squares chooses parameters by minimizing squared residuals; the useful understanding comes from assumptions, conditioning and residual diagnostics.","ŷ = wᵀx + b · argmin ||Xw-y||²","from sklearn.linear_model import LinearRegression\nmodel=LinearRegression().fit(X,y)\npred=model.predict(X_test)"],"Self-attention":["Self-attention lets each position construct a representation using information from other positions. Query, key and value projections create a learned compatibility mechanism.","Attention(Q,K,V) = softmax(QKᵀ / √dₖ)V","scores=(Q@K.T)/(Q.shape[-1]**0.5)\nweights=np.exp(scores-scores.max(-1,keepdims=True))\nweights/=weights.sum(-1,keepdims=True)\nout=weights@V"],"Bellman equations":["A value function decomposes future return recursively. This turns long-horizon reasoning into a local relationship between immediate reward and successor value.","Vπ(s)=Eπ[rₜ+γVπ(sₜ₊₁)|sₜ=s]","V=np.zeros(n_states)\nfor _ in range(100):\n    V=reward+gamma*P@V"],"LoRA & QLoRA":["Low-rank adaptation changes a small number of trainable parameters while keeping the base weights fixed. QLoRA adds quantized base weights to reduce memory requirements.","W′ = W + BA, with rank(BA) ≪ rank(W)","W_adapted=W+B@A\n# train A and B; keep W frozen"],"Data drift":["Data drift means the production input distribution changes relative to the training distribution. It is a signal that must be interpreted alongside data quality and model performance.","P_train(X) ≠ P_prod(X)","shift=np.abs(X_train.mean(0)-X_prod.mean(0))"],"RAG":["RAG is a measurable retrieval-and-generation pipeline. A wrong answer can originate in ingestion, chunking, retrieval, ranking, context construction, generation or evaluation.","query → retrieve → rerank → context → generate → evaluate","# pipeline sketch\nchunks=chunk(document)\nindex.add(embed(chunks))\ncandidates=index.search(embed(query))"]};return S[t]}
function lessonPage(mid,i){
let m=M.find(x=>x[0]===String(mid)),u=m[3][i],sp=spec(u[0]),k="bp:"+mid+":"+i,note=localStorage.getItem("note:"+k)||"",is=done(mid,i);
const domain=u[1], title=u[0];
const blueprints={
"Linear algebra":["Representations, geometry and operators","Treat vectors, matrices and linear maps as mathematical objects. Track dimensions explicitly and distinguish coordinate choices from the underlying structure.","Write the object in coordinates, derive the operation, then test invariants such as rank, orthogonality, conditioning or reconstruction error."],
"Probability":["Uncertainty, distributions and inference","State the sample space, random variables and conditional relationships before computing a probability. Distinguish a model assumption from an empirical observation.","Derive the quantity from definitions, simulate it, then compare empirical and theoretical behavior."],
"Statistics":["Estimation, evidence and uncertainty","Separate an estimator, its sampling distribution, an observed statistic and the decision rule. State what is and is not identified by the data.","Use a controlled synthetic experiment to verify bias, variance, coverage or error rates."],
"Optimization":["Objectives, geometry and algorithms","Make the objective, constraints, differentiability and curvature explicit. A solver is an algorithm for a mathematical problem, not the problem itself.","Compare optimization trajectories under controlled initialization, step size and conditioning."],
"Algorithms":["Complexity, invariants and trade-offs","Specify input, output, correctness invariant and asymptotic cost. For data-intensive AI, memory traffic and sparsity can matter as much as arithmetic count.","Benchmark both asymptotic behavior and constant-factor system costs."],
"Systems":["Data movement, concurrency and resource limits","Model the data path and resource bottlenecks. Distinguish parallelism, concurrency, synchronization and distributed execution.","Measure throughput, latency, memory pressure and failure behavior rather than relying on intuition."],
"Supervised learning":["Function estimation from labeled data","Define the prediction target, hypothesis class, loss and data-generating assumptions. Connect empirical risk to generalization.","Compare a simple baseline with regularization or capacity changes under a fixed evaluation protocol."],
"Statistical learning":["Generalization, capacity and uncertainty","Relate training error to out-of-sample error and identify sources of variance, bias and distribution shift.","Use repeated splits or controlled synthetic data to isolate the mechanism being studied."],
"Regularization":["Controlling effective complexity","Interpret the penalty as a change to the optimization objective or hypothesis preference, not merely a hyperparameter.","Plot training and validation behavior across a regularization path."],
"Trees":["Recursive partitioning and inductive bias","Describe the split criterion, stopping rule and resulting partition of feature space. Explain how local decisions compose into a global predictor.","Inspect a small tree by hand and measure how depth changes fit and generalization."],
"Ensembles":["Combining weakly correlated errors","Explain how resampling, averaging or sequential correction changes the error distribution. Identify the diversity assumption behind the ensemble.","Compare one estimator with an ensemble while holding the evaluation protocol constant."],
"Boosting systems":["Stage-wise functional optimization","Understand boosting as additive modeling driven by residual or gradient information. Separate the mathematical idea from a library implementation.","Track validation loss and individual learner contributions across boosting rounds."],
"Unsupervised learning":["Structure discovery without labels","Define what structure the method is optimizing for and what ambiguity remains without ground-truth labels.","Use synthetic data with known geometry to test recovery and failure cases."],
"Probabilistic clustering":["Latent-variable models","Specify latent variables, conditional independence assumptions and the likelihood. Interpret clusters as a model-dependent explanation of the data.","Compare likelihood, assignments and uncertainty under different initializations."],
"Inference":["Latent structure and iterative estimation","Write the latent-variable objective and identify which quantities are observed, hidden and estimated.","Use a toy dataset to inspect convergence, local optima and sensitivity to initialization."],
"Representation":["Compression and coordinate systems","Explain what information is preserved, discarded or made easier to model by the representation.","Measure reconstruction, downstream utility or neighborhood preservation as appropriate."],
"Evaluation":["Measurement design and statistical validity","Choose metrics from the decision problem, prevalence and error costs. Treat the evaluation protocol as part of the model.","Stress-test the metric under class imbalance, leakage, calibration and distribution shift."],
"Neural networks":["Composed differentiable functions","View a neural network as a composition of parameterized functions and connect the computational graph to gradients and optimization.","Perform a tiny forward/backward calculation and verify it numerically with finite differences."],
"Activations":["Nonlinearity and optimization geometry","Explain why a nonlinear activation changes representational capacity and how its derivative affects optimization.","Plot the function and derivative and inspect gradient behavior over a controlled input range."],
"Training systems":["Stable optimization of parameterized models","Separate initialization, normalization, optimization and regularization effects. Explain why training stability is an empirical property to measure.","Run a controlled ablation changing one training component at a time."],
"Computer vision":["Spatial inductive bias","Connect local connectivity, translation structure and receptive fields to the computational graph.","Visualize feature maps or receptive fields and test sensitivity to spatial transformations."],
"Detection":["Localization and classification under spatial uncertainty","Separate classification, localization and matching objectives. Explain the evaluation protocol and error taxonomy.","Inspect false positives, false negatives and localization errors rather than only aggregate scores."],
"Vision":["Dense spatial prediction","Define the unit of prediction and the spatial correspondence between inputs and outputs.","Evaluate boundary errors and class-specific behavior on a controlled subset."],
"Robotics vision":["Perception under motion and uncertainty","Connect image observations, geometry, temporal state and uncertainty. Distinguish perception errors from downstream estimation errors.","Test sensitivity to viewpoint, motion blur and calibration assumptions."],
"Sequence models":["State, memory and temporal credit assignment","Explain how information is carried across positions and why long-range dependencies create optimization challenges.","Construct a synthetic sequence task with controllable dependency length."],
"Attention":["Content-addressed interaction","Define queries, keys and values and interpret attention weights as data-dependent mixing coefficients.","Visualize attention patterns and test how scaling, masking and sequence length affect behavior."],
"Transformers":["Parallel sequence modeling with attention","Describe the block composition, positional information, residual pathways and normalization choices.","Ablate attention heads, context length or positional encoding on a small task."],
"NLP":["Language representation and sequence prediction","State the tokenization, representation and prediction task before discussing model architecture. Identify vocabulary and distribution assumptions.","Inspect tokenization behavior and evaluate performance across linguistic edge cases."],
"Reinforcement learning":["Sequential decision-making under uncertainty","Define states, actions, transitions, rewards, discounting and policy. Distinguish policy evaluation from policy improvement.","Use a small environment where the optimal policy can be computed exactly."],
"Policy gradients":["Optimization over stochastic policies","Derive the objective gradient and identify the source of variance in the estimator.","Compare learning curves across seeds and inspect estimator variance."],
"Information retrieval":["Matching queries to useful evidence","Define relevance, candidate generation and ranking separately. Retrieval quality and generation quality are different measurements.","Evaluate recall@k, precision@k or ranking metrics before adding a generator."],
"Vector indexing":["Approximate nearest-neighbor search","Explain the trade-off among recall, latency, memory and index construction cost.","Benchmark exact search against approximate search while varying corpus size and k."],
"Big data":["Distributed data processing","Model partitioning, shuffles, locality and fault tolerance. Explain where communication becomes the bottleneck.","Measure stage time and data movement on a small reproducible workload."],
"Distributed AI":["Parallel execution and coordination","Separate data parallelism, model parallelism and task parallelism. Identify synchronization and failure boundaries.","Measure scaling efficiency rather than assuming more workers always help."],
"Generative modeling":["Learning a distribution, not just a predictor","State the data distribution being modeled, the training objective and the sampling procedure. Distinguish likelihood, implicit and score-based formulations.","Compare samples, training diagnostics and failure modes under controlled capacity."],
"LLM adaptation":["Parameter-efficient specialization","Separate pretrained knowledge from the adaptation objective and trainable parameter subset. Explain the memory and optimization implications.","Compare base and adapted behavior on held-out prompts and task-specific metrics."],
"Alignment":["Preference optimization and behavioral objectives","Define the preference signal, reference policy or reward formulation and the failure modes introduced by the optimization target.","Construct adversarial or ambiguous preference cases and inspect model behavior."],
"RAG":["Retrieval-conditioned generation","Treat ingestion, chunking, embedding, retrieval, reranking, context assembly and generation as separately testable stages.","Measure retrieval recall and answer faithfulness independently before optimizing the full pipeline."],
"Agents":["Tool-mediated decision loops","Specify the state, available tools, action schema, termination condition and verification mechanism. Autonomy is a systems property, not a prompt phrase.","Trace complete trajectories and classify planning, tool-use and verification failures."],
"Agent frameworks":["Orchestration abstractions","Understand the state machine or graph underneath the framework and identify where control, memory, retries and tool execution actually occur.","Rebuild one minimal workflow without the framework, then compare observability and complexity."],
"Optimization":["Objective, constraints and numerical behavior","Identify the optimization problem, gradient information, curvature and constraints before choosing an optimizer.","Compare convergence, sensitivity and computational cost under controlled conditions."],
"Inference":["Serving-time computation","Separate model computation from preprocessing, batching, scheduling and postprocessing. Define latency percentiles and throughput precisely.","Benchmark cold-start, steady-state and different batch sizes."],
"Serving":["Reliable model endpoints","Define request contracts, batching, concurrency, timeouts and failure semantics. A serving system is more than a model wrapped in HTTP.","Load-test the endpoint and report p50/p95/p99 latency and throughput."],
"Infrastructure":["Reproducible execution environments","Make dependencies, resources, configuration and deployment boundaries explicit.","Build the smallest reproducible environment and record its provenance."],
"MLOps":["Lifecycle automation and lineage","Track data, code, model artifacts, metrics and deployment state so a result can be reproduced.","Demonstrate one end-to-end path from data version to evaluated model artifact."],
"Monitoring":["Operational evidence over time","Distinguish data quality, drift, model quality and service health. Monitoring should connect signals to decisions.","Inject a controlled change and verify that the monitoring system detects the intended condition."],
"Governance":["Constraints, accountability and auditability","Document intended use, limitations, data provenance, evaluation populations and escalation paths.","Create an audit record for one model release and test whether a reviewer can reconstruct the decision."],
"Interpretability":["Attribution, explanation and causal caution","Distinguish feature attribution from causal effect and local explanation from global behavior.","Compare explanations across perturbations and identify instability."],
"Quantization":["Reduced-precision computation","Explain how numerical representation affects memory, arithmetic, accuracy and hardware utilization.","Benchmark quality and latency across precision settings with a fixed model and workload."]
};
let b=blueprints[domain]||blueprints[Object.keys(blueprints).find(k=>domain.includes(k))]||["Mechanism, assumptions and evidence","Study the concept as a mathematical or systems mechanism. State the objects involved, assumptions, objective and expected behavior before reaching for a framework.","Construct a minimal experiment that can distinguish competing explanations and record the evidence."];
let intro=sp?sp[0]:b[1];
let formula=sp?sp[1]:"Define the objects, objective and assumptions before choosing an implementation. Then derive the computation from the stated objective.";
let code=sp?sp[2]:"# minimal experiment\n# 1. define inputs and assumptions\n# 2. implement the smallest mechanism\n# 3. measure a meaningful metric\n# 4. inspect failure cases";
shell('<button class="btn" onclick="modulePage('+mid+')">← Module '+mid+'</button>'+
'<section class="card section reader"><div class="ey">Deep study unit · '+esc(domain)+'</div><h1>'+esc(title)+'</h1><p class="lead">'+esc(intro)+'</p><div class="heroMeta"><span><b>Level</b> postgraduate</span><i></i><span><b>Mode</b> theory + implementation</span><i></i><span><b>Status</b> '+(is?"complete":"in progress")+'</span></div></section>'+
'<section class="card section study"><div class="ey">Learning contract</div><h2>'+esc(b[0])+'</h2><p>'+esc(b[1])+'</p><div class="objective"><span>Definitions</span><span>Assumptions</span><span>Derivation</span><span>Implementation</span><span>Experiment</span><span>Failure analysis</span></div><div class="call"><b>Prerequisite check:</b> Before continuing, write down the prerequisite concepts you expect to use. If you cannot explain them, open the relevant earlier lesson rather than treating the gap as memorization.</div></section>'+
'<section class="card section study"><div class="ey">01 · Formalize</div><h2>Mathematical structure</h2><p>Start from definitions. Identify every symbol, its domain and dimensions. Then derive the computation that an implementation must perform.</p><div class="formula">'+esc(formula)+'</div><div class="step"><span class="stepNo">A</span><div><b>Assumptions</b><br><span class="muted">State distributional, geometric, optimization or systems assumptions explicitly.</span></div></div><div class="step"><span class="stepNo">B</span><div><b>Objective</b><br><span class="muted">State what is minimized, maximized, estimated, predicted or retrieved.</span></div></div><div class="step"><span class="stepNo">C</span><div><b>Mechanism</b><br><span class="muted">Explain the sequence of computations that connects inputs to the objective or output.</span></div></div></section>'+
'<section class="card section study"><div class="ey">02 · Implement</div><h2>Build the smallest faithful version.</h2><pre class="code">'+esc(code)+'</pre><p class="muted">Use a minimal implementation first. Framework abstractions come after the mechanism is understood. Record package versions, random seeds, data splits and hardware when they affect reproducibility.</p></section>'+
'<section class="card section study"><div class="ey">03 · Experiment</div><h2>Turn the concept into evidence.</h2><div class="step"><span class="stepNo">1</span><div><b>Baseline</b><br><span class="muted">Choose the simplest meaningful reference and record its result.</span></div></div><div class="step"><span class="stepNo">2</span><div><b>Controlled change</b><br><span class="muted">Change exactly one mechanism, assumption, data property or hyperparameter.</span></div></div><div class="step"><span class="stepNo">3</span><div><b>Measurement</b><br><span class="muted">Use a metric appropriate to the task and report uncertainty or variability where meaningful.</span></div></div><div class="step"><span class="stepNo">4</span><div><b>Interpretation</b><br><span class="muted">Explain why the observation supports or contradicts the hypothesis. Do not confuse correlation with mechanism.</span></div></div></section>'+
'<section class="card section study"><div class="ey">04 · Failure analysis</div><h2>Know how the method breaks.</h2><p>Classify failures as data, assumption, objective, optimization, implementation, evaluation or deployment failures. Record at least one concrete counterexample or adversarial case.</p><div class="studyGrid"><article class="card study"><h3>Falsification test</h3><p class="muted">What observation would make your current explanation wrong?</p></article><article class="card study"><h3>Reproducibility test</h3><p class="muted">Does the conclusion survive a new seed, split, perturbation or environment?</p></article></div></section>'+
'<section class="card section study"><div class="ey">05 · Assessment</div><h2>Postgraduate checkpoint</h2><button class="choice" onclick="answer(this,true)">I can define the method, derive its core computation, implement a minimal version and defend the evaluation design.</button><button class="choice" onclick="answer(this,false)">I recognize the terminology and can describe the result, but I have not verified the mechanism.</button><div id="feedback" class="muted"></div><h3 style="margin-top:26px">Assignment</h3><p class="muted">Produce a one-page technical note containing: problem statement, assumptions, derivation, implementation choice, experimental protocol, result table, failure case and limitation.</p><h3>Research questions</h3><div class="objective"><span>What assumption is most restrictive?</span><span>Which ablation is decisive?</span><span>What breaks under distribution shift?</span><span>What remains unexplained?</span></div></section>'+
'<section class="card section study"><div class="ey">06 · Personal notebook</div><h2>Record what you can now prove.</h2><textarea class="note" id="note" placeholder="Write definitions, derivations, observations, mistakes, experiment results and open questions.">'+esc(note)+'</textarea><div class="actions"><button class="btn" onclick="saveNote('+mid+','+i+')">Save locally</button><button class="btn primary" onclick="complete('+mid+','+i+')">'+(is?"Completed ✓":"Mark lesson complete")+'</button></div></section>');
}
function answer(b,ok){document.querySelectorAll(".choice").forEach(x=>x.classList.remove("correct","wrong"));b.classList.add(ok?"correct":"wrong");$("#feedback").textContent=ok?"Good. Now demonstrate it with an example or implementation.":"Return to the definition, mechanism and verification steps."}

function page(p){if(p==="projects")shell('<section class="card section"><div class="ey">Project Studio</div><h1 style="font-size:clamp(42px,5vw,64px)">Build systems, not demos.</h1><p class="lead">A project ladder that forces implementation, measurement, failure analysis and system design.</p></section><section class="card section"><div class="grid">'+P.map((x,i)=>'<article class="card project"><div class="ey">PROJECT '+String(i+1).padStart(2,"0")+'</div><h3>'+esc(x[0])+'</h3><p class="muted">'+esc(x[1])+'</p><span class="tag">Build · Measure · Explain</span></article>').join("")+'</div></section>');else if(p==="academic")shell('<section class="card section"><div class="ey">Academic pacing</div><h1 style="font-size:clamp(42px,5vw,64px)">Four semesters.</h1><p class="lead">A pacing model for the independent curriculum, not an official university degree plan.</p></section>'+SEM.map(s=>'<section class="card section"><div class="ey">'+esc(s[0])+'</div><h2>Course structure</h2><p>'+esc(s[1])+'</p></section>').join(""));else shell('<section class="card section"><div class="ey">Reference</div><h1 style="font-size:clamp(42px,5vw,64px)">Glossary.</h1><p class="lead">Define terms formally, explain them intuitively and connect them to implementation and failure modes.</p></section><section class="card section"><div class="grid">'+["Autograd","Bayes theorem","Backpropagation","Bias–variance","Calibration","Concept drift","Embeddings","Fine-tuning","HNSW","KKT","LoRA","MAP","MLE","PEFT","RAG","ReAct","SVD","TD learning","Vector store","Quantization"].map(x=>'<article class="card project"><h3>'+x+'</h3><p class="muted">Definition → mechanism → implementation → limitation.</p></article>').join("")+'</div></section>')}
