name: Android Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'

      - name: Install Gradle 7.3.3 directly
        run: |
          set -e
          wget -q https://github.com/gradle/gradle-distributions/releases/download/v7.3.3/gradle-7.3.3-bin.zip -O /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /opt
          echo "/opt/gradle-7.3.3/bin" >> "$GITHUB_PATH"
          /opt/gradle-7.3.3/bin/gradle --version

      - name: Build debug APK
        run: gradle --no-daemon --no-build-cache assembleDebug

      - name: Verify APK
        run: |
          set -e
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          unzip -tq "$APK"
          unzip -l "$APK" | grep -q 'AndroidManifest.xml'
          echo "APK verified: $APK"
          ls -lh "$APK"

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: BlackPearl-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
