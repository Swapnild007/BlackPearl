name: Android Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'

      - name: Install Gradle 7.3.3 directly
        run: |
          set -e
          wget -q https://github.com/gradle/gradle-distributions/releases/download/v7.3.3/gradle-7.3.3-bin.zip -O /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /opt
          echo "/opt/gradle-7.3.3/bin" >> "$GITHUB_PATH"
          /opt/gradle-7.3.3/bin/gradle --version

      - name: Build debug APK
        run: gradle --no-daemon --no-build-cache assembleDebug

      - name: Verify APK exists
        run: |
          set -e
          test -s app/build/outputs/apk/debug/app-debug.apk
          unzip -l app/build/outputs/apk/debug/app-debug.apk | grep -q 'AndroidManifest.xml'
          echo "APK sanity check passed"

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: BlackPearl-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  smoke-test:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download debug APK
        uses: actions/download-artifact@v4
        with:
          name: BlackPearl-debug
          path: app/build/outputs/apk/debug

      - name: Launch Android emulator and smoke test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          target: default
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -noaudio -no-boot-anim -gpu swiftshader_indirect -no-snapshot
          script: |
            set -e

            echo "Installing BlackPearl APK..."
            adb install -r app/build/outputs/apk/debug/app-debug.apk

            echo "Verifying package registration..."
            PACKAGE_PATH=$(adb shell pm path com.blackpearl.lab | tr -d '\r')
            echo "$PACKAGE_PATH"
            test -n "$PACKAGE_PATH"
            echo "$PACKAGE_PATH" | grep -Fq 'base.apk'

            echo "Launching MainActivity..."
            adb shell am force-stop com.blackpearl.lab || true
            adb shell am start -n com.blackpearl.lab/.MainActivity

            echo "Waiting for application process..."
            sleep 3
            PID=$(adb shell pidof com.blackpearl.lab 2>/dev/null | tr -d '\r' || true)
            echo "PID: $PID"
            test -n "$PID"

            echo "Verifying activity/package state..."
            adb shell dumpsys activity activities > /tmp/activity.txt
            adb shell dumpsys package com.blackpearl.lab > /tmp/package.txt
            grep -Fq 'com.blackpearl.lab' /tmp/activity.txt
            grep -Fq 'com.blackpearl.lab/.MainActivity' /tmp/package.txt

            echo "Phase 2 Android launch smoke test passed"
