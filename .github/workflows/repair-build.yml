name: Repair Wrapper and Build

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 11
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'

      - name: Install Gradle 7.3.3 from GitHub release
        run: |
          set -e
          wget -q https://github.com/gradle/gradle-distributions/releases/download/v7.3.3/gradle-7.3.3-bin.zip -O /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /opt
          echo "/opt/gradle-7.3.3/bin" >> "$GITHUB_PATH"
          /opt/gradle-7.3.3/bin/gradle --version

      - name: Generate official Gradle wrapper
        run: gradle wrapper --gradle-version 7.3.3 --distribution-type bin

      - name: Verify wrapper
        run: |
          test -f gradle/wrapper/gradle-wrapper.jar
          ls -lh gradle/wrapper/gradle-wrapper.jar

      - name: Commit wrapper files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gradlew gradle/wrapper/gradle-wrapper.jar gradle/wrapper/gradle-wrapper.properties
          if ! git diff --cached --quiet; then
            git commit -m "chore: restore Gradle 7.3.3 wrapper [skip ci]"
            git push origin HEAD:main
          fi

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: BlackPearl-debug
          path: app/build/outputs/apk/debug/app-debug.apk
